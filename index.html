<title>Eversource Unit Billing — Sign in</title>
<style>
:root{--navy:#17365D;--navy2:#1F4E78;--line:#DDE3EA;--muted:#5D6B7E;--bad:#9C0006;--badbg:#FCE4E4}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(160deg,#17365D 0%,#1F4E78 55%,#2E6DA4 100%);color:#1B2430;display:grid;place-items:center;padding:16px}
.card{background:#fff;width:min(400px,100%);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.28);padding:30px 30px 24px}
.logo{display:block;width:190px;margin:0 auto 8px}
h1{font-size:19px;text-align:center;margin:6px 0 2px;color:var(--navy)}
p.sub{text-align:center;color:var(--muted);margin:0 0 22px;font-size:13px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px}
input{width:100%;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:8px;padding:10px 11px}
input:focus{outline:2px solid #9DC3E6;border-color:#9DC3E6}
button{width:100%;margin-top:20px;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:11px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
button:hover{background:var(--navy2)}button:disabled{opacity:.6;cursor:wait}
.err{display:none;margin-top:14px;background:var(--badbg);color:var(--bad);border-radius:8px;padding:9px 11px;font-size:13px}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:18px}
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const enc = new TextEncoder();
async function sha256hex(s){ const h=await crypto.subtle.digest("SHA-256",enc.encode(s)); return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
async function unlock(contentKeyRaw, user){
  const key=await crypto.subtle.importKey("raw",contentKeyRaw,"AES-GCM",false,["decrypt"]);
  const zipped=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(VAULT.data.iv)},key,b64(VAULT.data.ct));
  const html=await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  window.__PG_USER=user;
  const inject=`<script>window.__PG_USER=${JSON.stringify(user).replace(/</g,"\\u003c")};<\/script>`;
  document.open(); document.write(html.replace("<head>","<head>"+inject)); document.close();
}
async function login(username,password){
  const id=await sha256hex(VAULT.salt+"|"+username.trim().toLowerCase());
  const rec=VAULT.users[id]; if(!rec) throw new Error("bad");
  const base=await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveKey"]);
  const kek=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(rec.s),iterations:VAULT.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  let inner; try{ inner=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(rec.iv)},kek,b64(rec.ct)))); }catch(e){ throw new Error("bad"); }
  return inner; // {k, name, role, u}
}
(async()=>{ // stay signed in for this browser tab only
  try{ const s=JSON.parse(sessionStorage.getItem("pg.session")||"null");
    if(s&&s.build===VAULT.build){ await unlock(b64(s.k),s.user); return; } }catch(e){ try{sessionStorage.removeItem("pg.session")}catch(_){} }
  const f=document.getElementById("f"), btn=document.getElementById("b"), err=document.getElementById("e");
  if(!window.crypto||!crypto.subtle||typeof DecompressionStream==="undefined"){ err.style.display="block"; err.textContent="This browser isn't supported. Please use a current version of Chrome, Edge or Safari."; btn.disabled=true; return; }
  document.getElementById("u").focus();
  f.onsubmit=async e=>{ e.preventDefault(); err.style.display="none"; btn.disabled=true; btn.textContent="Signing in…";
    try{ const inner=await login(document.getElementById("u").value,document.getElementById("p").value);
      const user={name:inner.name,role:inner.role,username:inner.u};
      try{ sessionStorage.setItem("pg.session",JSON.stringify({build:VAULT.build,k:inner.k,user})); }catch(_){}
      await unlock(b64(inner.k),user);
    }catch(ex){ err.textContent="Username or password is incorrect."; err.style.display="block"; btn.disabled=false; btn.textContent="Sign in"; document.getElementById("p").select(); } };
})();
</script>
